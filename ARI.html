<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I GOT YOU - Neon Karaoke Player</title>
    <style>
        /* Fondo elegante y oscuro texturizado */
        body {
            background: radial-gradient(circle at center, #0e0512 0%, #030105 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor principal dividido */
        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        /* SECCIÓN IZQUIERDA: Arte de la Rosa y Agua */
        .visual-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 40px;
            height: 85vh;
        }

        /* Gráfico SVG de la Rosa de Neón */
        .neon-rose {
            width: 260px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 7, 58, 0.7));
        }

        /* Efecto de Reflejo de Agua abajo con máscara gradual */
        .water-reflection {
            transform: scaleY(-0.8) translateY(15px);
            opacity: 0.3;
            filter: blur(2px) drop-shadow(0 0 10px rgba(255, 7, 58, 0.5));
            animation: waterRipple 4.5s ease-in-out infinite alternate;
            mask-image: linear-gradient(to top, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 100%);
        }

        /* Movimiento fluido del agua */
        @keyframes waterRipple {
            0% { transform: scaleY(-0.8) translateY(15px) skewX(-1.5deg) scaleX(0.97); filter: blur(2px); }
            50% { transform: scaleY(-0.8) translateY(18px) skewX(1.5deg) scaleX(1.03); filter: blur(3.5px); }
            100% { transform: scaleY(-0.8) translateY(15px) skewX(-0.5deg) scaleX(0.99); filter: blur(2.5px); }
        }

        /* SECCIÓN DERECHA: Control de Música y Karaoke */
        .lyrics-side {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        /* Reproductor de Audio Flotante */
        .audio-player-container {
            background: rgba(15, 6, 20, 0.6);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 20, 147, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .track-info {
            font-size: 0.9rem;
            color: #ff69b4;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 20, 147, 0.5);
        }

        .audio-player-container audio {
            width: 100%;
            outline: none;
        }

        /* Contenedor con Scroll de las letras */
        .lyrics-window {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, white 15%, white 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, white 15%, white 85%, transparent 100%);
        }

        /* Ocultar barra de scroll estéticamente */
        .lyrics-window::-webkit-scrollbar {
            width: 6px;
        }
        .lyrics-window::-webkit-scrollbar-thumb {
            background: rgba(255, 20, 147, 0.3);
            border-radius: 10px;
        }

        .lyrics-container {
            padding: 150px 0; /* Espacio para que la primera y última línea puedan centrarse */
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Líneas en estado apagado/espera */
        .lyric-line {
            font-size: 1.4rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.25);
            text-shadow: none;
            transition: all 0.4s ease;
            transform: scale(0.96);
            transform-origin: left center;
            cursor: pointer;
        }

        /* Línea Activa - Iluminada en Rosa Neón Intenso */
        .lyric-line.active {
            color: #fffbfe;
            transform: scale(1.05);
            opacity: 1;
            text-shadow: 
                0 0 6px #fff, 
                0 0 12px #ff1493, 
                0 0 24px #ff1493, 
                0 0 45px #ff007f;
        }

        /* Adaptabilidad para Celulares */
        @media (max-width: 900px) {
            .container { flex-direction: column; padding: 20px 10px; }
            .visual-side { position: relative; top: 0; height: auto; margin-bottom: 20px; }
            .neon-rose { width: 180px; }
            .lyrics-side { height: 60vh; }
            .lyric-line { font-size: 1.15rem; }
        }
    </style>
</head>

        <!-- LADO DERECHO: Reproductor y Letra Sincronizada -->
        <div class="lyrics-side">

    </div>
