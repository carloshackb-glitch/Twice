<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I GOT YOU - Neon Karaoke Player</title>
    <style>
        /* Fondo elegante y oscuro texturizado */
        body {
            background: radial-gradient(circle at center, #0e0512 0%, #030105 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor principal dividido */
        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        /* SECCIÓN IZQUIERDA: Arte de la Rosa y Agua */
        .visual-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 40px;
            height: 85vh;
        }

        /* Gráfico SVG de la Rosa de Neón */
        .neon-rose {
            width: 260px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 7, 58, 0.7));
        }

        /* Efecto de Reflejo de Agua abajo con máscara gradual */
        .water-reflection {
            transform: scaleY(-0.8) translateY(15px);
            opacity: 0.3;
            filter: blur(2px) drop-shadow(0 0 10px rgba(255, 7, 58, 0.5));
            animation: waterRipple 4.5s ease-in-out infinite alternate;
            mask-image: linear-gradient(to top, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 100%);
        }

        /* Movimiento fluido del agua */
        @keyframes waterRipple {
            0% { transform: scaleY(-0.8) translateY(15px) skewX(-1.5deg) scaleX(0.97); filter: blur(2px); }
            50% { transform: scaleY(-0.8) translateY(18px) skewX(1.5deg) scaleX(1.03); filter: blur(3.5px); }
            100% { transform: scaleY(-0.8) translateY(15px) skewX(-0.5deg) scaleX(0.99); filter: blur(2.5px); }
        }

        /* SECCIÓN DERECHA: Control de Música y Karaoke */
        .lyrics-side {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        /* Reproductor de Audio Flotante */
        .audio-player-container {
            background: rgba(15, 6, 20, 0.6);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 20, 147, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .track-info {
            font-size: 0.9rem;
            color: #ff69b4;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 20, 147, 0.5);
        }

        .audio-player-container audio {
            width: 100%;
            outline: none;
        }

        /* Contenedor con Scroll de las letras */
        .lyrics-window {
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, white 15%, white 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, white 15%, white 85%, transparent 100%);
        }

        /* Ocultar barra de scroll estéticamente */
        .lyrics-window::-webkit-scrollbar {
            width: 6px;
        }
        .lyrics-window::-webkit-scrollbar-thumb {
            background: rgba(255, 20, 147, 0.3);
            border-radius: 10px;
        }

        .lyrics-container {
            padding: 150px 0; /* Espacio para centrar la primera y última estrofa */
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Líneas en estado apagado/espera */
        .lyric-line {
            font-size: 1.4rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.25);
            text-shadow: none;
            transition: all 0.4s ease;
            transform: scale(0.96);
            transform-origin: left center;
            cursor: pointer;
        }

        /* Línea Activa - Iluminada en Rosa Neón Intenso */
        .lyric-line.active {
            color: #fffbfe;
            transform: scale(1.05);
            opacity: 1;
            text-shadow: 
                0 0 6px #fff, 
                0 0 12px #ff1493, 
                0 0 24px #ff1493, 
                0 0 45px #ff007f;
        }

        /* Adaptabilidad para Celulares */
        @media (max-width: 900px) {
            .container { flex-direction: column; padding: 20px 10px; }
            .visual-side { position: relative; top: 0; height: auto; margin-bottom: 20px; }
            .neon-rose { width: 180px; }
            .lyrics-side { height: 60vh; }
            .lyric-line { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LADO IZQUIERDO: Arte Rosa Neón -->
        <div class="visual-side">
            <!-- Rosa Original -->
            <svg class="neon-rose" viewBox="0 0 100 140" fill="none" xmlns="http://w3.org">
                <!-- Tallo y Hojas (Verde Neón) -->
                <path d="M50 70 Q48 100 52 135" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" filter="drop-shadow(0 0 5px #39FF14)" />
                <path d="M50 95 C35 90 30 80 40 75 C45 82 48 90 50 95 Z" fill="#228B22" stroke="#39FF14" stroke-width="1" filter="drop-shadow(0 0 3px #39FF14)" />
                <path d="M51 110 C65 112 70 102 60 95 C55 102 53 107 51 110 Z" fill="#228B22" stroke="#39FF14" stroke-width="1" filter="drop-shadow(0 0 3px #39FF14)" />
                <!-- Pétalos (Rojo Neón) -->
                <path d="M50 72 C30 55 35 35 50 30 C65 35 70 55 50 72 Z" fill="#8B0000" stroke="#FF073A" stroke-width="2" filter="drop-shadow(0 0 6px #FF073A)" />
                <path d="M43 60 C32 45 40 38 48 42 C40 48 40 55 43 60 Z" fill="#B22222" stroke="#FF073A" stroke-width="1.5" />
                <path d="M57 60 C68 45 60 38 52 42 C60 48 60 55 57 60 Z" fill="#B22222" stroke="#FF073A" stroke-width="1.5" />
                <path d="M50 45 C45 35 55 35 50 45 Z" fill="#FF073A" stroke="#FF5555" stroke-width="1" />
            </svg>

            <!-- Reflejo en el Agua -->
            <svg class="neon-rose water-reflection" viewBox="0 0 100 140" fill="none" xmlns="http://w3.org">
                <path d="M50 70 Q48 100 52 135" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" filter="drop-shadow(0 0 5px #39FF14)" />
                <path d="M50 95 C35 90 30 80 40 75 C45 82 48 90 50 95 Z" fill="#228B22" stroke="#39FF14" stroke-width="1" filter="drop-shadow(0 0 3px #39FF14)" />
                <path d="M51 110 C65 112 70 102 60 95 C55 102 53 107 51 110 Z" fill="#228B22" stroke="#39FF14" stroke-width="1" filter="drop-shadow(0 0 3px #39FF14)" />
                <path d="M50 72 C30 55 35 35 50 30 C65 35 70 55 50 72 Z" fill="#8B0000" stroke="#FF073A" stroke-width="2" filter="drop-shadow(0 0 6px #FF073A)" />
                <path d="M43 60 C32 45 40 38 48 42 C40 48 40 55 43 60 Z" fill="#B22222" stroke="#FF073A" stroke-width="1.5" />
                <path d="M57 60 C68 45 60 38 52 42 C60 48 60 55 57 60 Z" fill="#B22222" stroke="#FF073A" stroke-width="1.5" />
                <path d="M50 45 C45 35 55 35 50 45 Z" fill="#FF073A" stroke="#FF5555" stroke-width="1" />
            </svg>
        </div>

        <!-- LADO DERECHO: Reproductor y Letra Sincronizada -->
        <div class="lyrics-side">
            <div class="audio-player-container">
                <div class="track-info">TWICE — I GOT YOU</div>
                <!-- Corrección: Se añade type y preload para asegurar compatibilidad web masiva -->
                <audio id="audio" controls preload="auto">
                    <source src="music.mp3" type="audio/mpeg">
                    Tu navegador no soporta el elemento de reproducción de audio.
                </audio>
            </div>

            <div class="lyrics-window" id="lyricsWindow">
                <div class="lyrics-container" id="lyricsContainer">
                    <!-- Los bloques de letras se inyectan dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mapeo exacto de marcas de tiempo (en segundos) para la letra de "I GOT YOU"
        const lyricsData = [
            { time: 0, text: "🎵 (Instrumental Intro)" },
            { time: 5.5, text: "A little reckless\nAround the edges" },
            { time: 10.0, text: "Call it young, dumb love\nAnd it's just enough" },
            { time: 15.0, text: "Keep me guessing (keep me guessing)\nHow the story unfolds with you (with you)" },
            { time: 24.5, text: "When I'm walking\nInto the darkness" },
            { time: 29.5, text: "I know you'll be right there\nLighting up the flares" },
            { time: 34.0, text: "When it's starless\nI will follow you to the Moon, ayy" },
            { time: 43.5, text: "No, we'll never fall apart (never fall apart)" },
            { time: 48.0, text: "Even million miles apart (million miles apart)" },
            { time: 53.0, text: "We were lightning from the start (lightning from the start)" },
            { time: 58.0, text: "And it keeps me going to know that" },
            { time: 62.0, text: "Ooh\nNo matter what, you got me, I got you" },
            { time: 67.5, text: "And I wouldn't want it any other way" },
            { time: 72.0, text: "Ooh\nNo drop of doubt, I know deep down that" },
            { time: 77.0, text: "We'll make it through, just like we always do" },
            { time: 82.5, text: "Ayy\nEvery second, every minute" },
            { time: 87.0, text: "Want you close to me\nLike you're supposed to be" },
            { time: 91.5, text: "Ain't no limit (ain't no limit)\nTo what I would do for you, oh" },
            { time: 101.0, text: "And you know\nYou turn my whole world upside down" },
            { time: 106.0, text: "Catch me before I ever hit the ground" },
            { time: 110.5, text: "And I'd do the same for you, oh" },
            { time: 119.8, text: "No, we'll never fall apart (no, we'll never fall apart)" },
            { time: 124.5, text: "Even million miles apart (even million miles apart)" },
            { time: 129.5, text: "We were lightning from the start (we were lightning from the)" },
            { time: 134.5, text: "And it keeps me going to know that" },
            { time: 138.5, text: "Ooh\nNo matter what, you got me, I got you" },
            { time: 144.0, text: "And I wouldn't want it any other way" },
            { time: 148.5, text: "Ooh\nNo drop of doubt, I know deep down that" },
            { time: 153.5, text: "We'll make it through, just like we always do" },
            { time: 158.5, text: "Do-do-do-do-do-do-do\nDo-do-do-do-do-do-do\nDo-do-do-do-do-do-do\nOh-oh" },
            { time: 177.0, text: "Ooh\nNo matter what, you got me, I got you" },
            { time: 182.5, text: "And I wouldn't want it any other way" },
            { time: 187.0, text: "Ooh\nNo drop of doubt, I know deep down that" },
            { time: 192.0, text: "We'll make it through, just like we always do" },
            { time: 197.0, text: "Do-do-do-do-do-do-do (that we do)\nDo-do-do-do-do-do-do (we do)\nDo-do-do-do-do-do-do (just like we always do)" }
];
const audio = document.getElementById('audio');
const lyricsContainer = document.getElementById('lyricsContainer');
const lyricsWindow = document.getElementById('lyricsWindow');
// Generar las líneas de karaoke en la pantalla
lyricsData.forEach((item, index) => {
const div = document.createElement('div');
div.className = 'lyric-line';
div.id = line-${index};
div.innerHTML = item.text.replace(/\n/g, '
');
// Permitir hacer clic en un verso para saltar directamente a ese momento de la canción
div.addEventListener('click', () => {
audio.currentTime = item.time;
});
lyricsContainer.appendChild(div);
});
// Detectar el progreso de la música y encender la letra correspondiente
audio.addEventListener('timeupdate', () => {
const currentTime = audio.currentTime;
let activeIndex = -1;
// Encontrar qué línea corresponde al tiempo actual
for (let i = 0; i < lyricsData.length; i++) {
if (currentTime >= lyricsData[i].time) {
activeIndex = i;
} else {
break;
}
}
if (activeIndex !== -1) {
// Quitar la clase activa a todas las líneas
document.querySelectorAll('.lyric-line').forEach(line => line.classList.remove('active'));
// Activar la línea correspondiente
const activeLine = document.getElementById(line-${activeIndex});
if (activeLine) {
activeLine.classList.add('active');
// Centrar automáticamente la línea activa dentro de la ventana de scroll
const windowHeight = lyricsWindow.clientHeight;
const lineTop = activeLine.offsetTop;
const lineHeight = activeLine.clientHeight;
lyricsWindow.scrollTop = lineTop - (windowHeight / 2) + (lineHeight / 2);
}
}
});
